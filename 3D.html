<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D site</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Yellowtail&display=swap" rel="stylesheet">
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        html, body{
            width: 100%;
            min-height: 100vh;
            background: #0a0119;
        }
        .page1{
            position: relative;
            color: #fff;
            overflow: hidden;
        }
        nav{
            height: 5rem;
            padding: 2rem 3rem 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        a{
            text-decoration: none;
            color: white;
        }
        nav h1{
            font-size: 2rem;
            font-family: "Yellowtail", cursive;
            font-weight: 400;
        }
        .navigation{
            display: flex;
            position: relative;
            gap: 2rem;
            z-index: 1;
        }
        .navigation a{
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        .main{
            height: calc(100vh - 5rem);
            display: flex;
        }
        .main .left{
            width: 60%;
            padding: 2rem 4rem 2rem 4rem;
            justify-content: center;
            display: flex;
            flex-direction: column;
            align-items: start;
            gap: 1rem;
        }
        .main .left h1{
            font-size: 4rem;
            font-weight: 500;
        }
        .main .left p{
            width: 80%;
            font-size: 0.9rem;
            color: gray;
            mix-blend-mode: exclusion;
        }
        .btn{
            position: relative;
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
            z-index: 1;
        }
        #contact, #started{
            position: relative;
            width: 12rem;
            padding: 1rem 2rem 1rem 2rem;
            font-size: 1.3rem;
            border-radius: 30px;
            background: white;
            color: #0b021c;
            cursor: pointer;
            overflow: hidden;
            transition: 0.75s;
            border: 2px solid #fff;
            z-index: 2;
        }
        #started{
            background: transparent;
            color: #fff;
        }
        #started::before, #contact::before{
            content: '';
            position: absolute;
            inset: 0;
            background: #fff;
            clip-path: circle(0% at 50% 50%);
            transition: 0.75s;
            z-index: -1;
        }
        #started:hover::before, #contact:hover::before{
            clip-path: circle(100% at 50%);
        }
        #started:hover{
            color: #0b021c;
        }
        #contact::before{
            background: #3e108a;
            filter: blur(2px);
        }
        #contact:hover{
            color: white;
        }
        .page1::before{
            content: '';
            position: absolute;
            background: #8665e4;
            bottom: -20%;
            left: -15%;
            width: 20rem;
            height: 20rem;
            border-radius: 50%;
            filter: blur(500px);
        }
         .page1::after{
            content: '';
            position: absolute;
            background: #8665e4;
            top: 10%;
            right: -5%;
            width: 20rem;
            height: 20rem;
            border-radius: 50%;
            filter: blur(500px);
        }
        .main .right{
            position: relative;
            width: 40%;
            justify-content: center;
            display: flex;
            align-items: center;
        }
        #threeD{
            position: absolute;
            width: 100%;
            height: 100%;
            bottom: 15%;
            right: 15%;
            transform: scale(40%);
        }
    </style>
</head>
<body>
    <div class="page1">
        <nav>
            <a href="#">
                <h1 class="logo">Deprimus Computers</h1>
            </a>
            <div class="navigation">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </nav>
        <div class="main">
            <div class="left">
                <h1>Step Into De New Genaration Computers & Accesories</h1>
                <p>Welcome to the future: A 3D Experiences! Our 3D website brings your imagination</p>
                <div class="btn">
                    <button id="contact">Contact Us</button>
                    <button id="started">Get Started</button>
                </div>
            </div>
            <div class="right"><spline-viewer id="threeD" url="https://prod.spline.design/sw9wWA2QGmsum-nU/scene.splinecode"></spline-viewer></div>
        </div>
    </div>
</body>
<script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.82/build/spline-viewer.js"></script>
<script src="./script.js"></script>
</html>
